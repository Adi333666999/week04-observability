apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-metrics-app 
  labels:
    app: flask-metrics 
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: flask-metrics
  template:
    metadata:
      labels:
        app: flask-metrics
    spec:
      containers:
        - name: flask-metrics-app
          image: airoli/flask-metrics-app:latest          
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 5000

              